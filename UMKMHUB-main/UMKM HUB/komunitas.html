<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komunitas & Chat UMKM - Obrolan Grup & Kolaborasi Privat | UMKM Hub</title>
  <meta name="description" content="Jejaring komunitas dan chat real-time UMKM Indonesia. Obrolan daerah, grup sektoral kuliner, kriya, fashion, serta chat privat antar-pengusaha.">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="site-navbar"></div>

  <main class="section-sm">
    <div class="container">
      <!-- Header Komunitas -->
      <div class="flex items-center justify-between section-header flex-wrap gap-2" style="margin-bottom: 1.25rem;">
        <div>
          <span class="section-eyebrow">Jejaring & Real-Time Chat</span>
          <h1 class="section-title">Grup Komunitas & Obrolan UMKM</h1>
          <p class="section-subtitle">
            Terhubung langsung dengan sesama pelaku usaha di kotamu atau sektor bisnismu
          </p>
        </div>
        <button id="btnOpenCreateCommModal" class="btn btn-secondary btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Buat Komunitas Baru
        </button>
      </div>

      <!-- Chat Dual-Panel Container Layout -->
      <div class="chat-container-layout" id="chatLayoutContainer">
        <!-- Sidebar Kiri: Daftar Komunitas & Percakapan Privat -->
        <aside class="chat-sidebar" id="chatSidebar">
          <div class="chat-sidebar-header">
            <!-- Tab Grup vs Direct Chat -->
            <div class="segmented-control w-full mb-3" style="width: 100%; display: flex;">
              <button id="tabCommGroups" class="segmented-item active" style="flex: 1; text-align: center;">Grup Komunitas</button>
              <button id="tabDirectChats" class="segmented-item" style="flex: 1; text-align: center;">Chat Privat</button>
            </div>

            <!-- Cari Komunitas -->
            <div class="input-with-icon">
              <div class="input-icon-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </div>
              <input type="text" id="commSearchInput" class="form-input" placeholder="Cari nama grup atau kota..." style="min-height: 38px; font-size: var(--text-xs);">
            </div>
          </div>

          <!-- List Percakapan / Grup Scrollable -->
          <div class="chat-list-scroll" id="conversationsListContainer">
            <!-- Injected via JS -->
          </div>
        </aside>

        <!-- Room Kanan: Ruang Obrolan Aktif -->
        <section class="chat-room" id="chatRoom" aria-label="Ruang Percakapan Aktif">
          <!-- Room Header -->
          <div class="chat-room-header">
            <div class="flex items-center gap-3">
              <!-- Tombol Kembali untuk HP / Layar Sentuh -->
              <button id="btnMobileBackToSidebar" class="btn-icon hide-desktop" style="width: 36px; height: 36px; color: var(--navy);" aria-label="Kembali ke Daftar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
              <div id="chatRoomIcon" style="font-size: 1.75rem; line-height: 1;">🏢</div>
              <div>
                <h2 id="chatRoomTitle" style="font-size: var(--text-base); color: var(--navy); margin: 0; line-height: 1.2;">
                  Nama Komunitas
                </h2>
                <div id="chatRoomSubtitle" style="font-size: 0.72rem; color: var(--text-muted);">
                  0 Anggota &bull; Terhubung
                </div>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button id="btnToggleMembers" class="btn btn-ghost btn-sm hide-mobile" style="font-size: 0.75rem;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Anggota
              </button>
            </div>
          </div>

          <!-- Message History Area -->
          <div class="chat-messages-area" id="chatMessagesArea">
            <!-- Chat Bubbles injected via JS -->
          </div>

          <!-- Input Bar -->
          <form class="chat-input-bar" id="chatSendMessageForm">
            <input type="text" id="chatMessageInput" class="form-input" placeholder="Ketik pesan untuk komunitas..." autocomplete="off" style="min-height: 44px; border-radius: var(--radius-full);">
            <button type="submit" class="btn btn-primary btn-md" style="border-radius: var(--radius-full); padding: 0.75rem 1.25rem;">
              <span>Kirim</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <!-- Modal Buat Komunitas Baru -->
  <div id="createCommModal" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Bentuk Komunitas UMKM Baru</h3>
        <button id="btnCloseCreateCommModal" class="modal-close" aria-label="Tutup">&times;</button>
      </div>
      <form id="createCommForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="newCommName">Nama Komunitas <span class="required">*</span></label>
            <input type="text" id="newCommName" class="form-input" placeholder="Contoh: UMKM Kreatif Malang Raya" required>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="form-group">
              <label class="form-label" for="newCommType">Basis Komunitas <span class="required">*</span></label>
              <select id="newCommType" class="form-select" required>
                <option value="kota">Domisili / Kota</option>
                <option value="kategori">Kategori Sektoral</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="newCommIcon">Ikon Emoji</label>
              <input type="text" id="newCommIcon" class="form-input" value="🤝" maxlength="3">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="newCommDesc">Deskripsi & Tujuan Komunitas <span class="required">*</span></label>
            <textarea id="newCommDesc" class="form-textarea" placeholder="Jelaskan tujuan paguyuban atau syarat anggota..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnCancelCreateComm" class="btn btn-outline btn-sm">Batal</button>
          <button type="submit" class="btn btn-primary btn-sm">Bentuk Komunitas</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Dynamic Footer & Mobile Bottom Navigation -->
  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>

  <!-- Scripts -->
  <script type="module" src="js/komunitas.js"></script>
</body>
</html>
