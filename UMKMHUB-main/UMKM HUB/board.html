<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Kolaborasi - Papan Pengumuman Kemitraan UMKM | UMKM Hub</title>
  <meta name="description" content="Papan pengumuman terbuka kemitraan B2B UMKM Indonesia. Cari pemasok, mitra bisnis, peluang event, dan tawarkan layanan usahamu.">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="site-navbar"></div>

  <main class="section-sm">
    <div class="container">
      <!-- Header Board -->
      <div class="flex items-center justify-between section-header flex-wrap gap-3">
        <div>
          <span class="section-eyebrow">Papan Pengumuman B2B</span>
          <h1 class="section-title">Board Kolaborasi UMKM</h1>
          <p class="section-subtitle">
            Pasang dan temukan peluang kerjasama, kebutuhan suplai bahan baku, kemasan, atau kemitraan event.
          </p>
        </div>
        <button id="btnOpenCreateBoardModal" class="btn btn-cta btn-md">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Pasang Pengumuman Baru
        </button>
      </div>

      <!-- Filter Bar: Search, Type Tabs, Location -->
      <div class="card mb-4" style="padding: 1.25rem;">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <!-- Cari Kata Kunci -->
          <div style="grid-column: span 2;">
            <div class="input-with-icon">
              <div class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </div>
              <input type="text" id="boardSearchInput" class="form-input" placeholder="Cari pengumuman atau kota...">
            </div>
          </div>

          <!-- Filter Tipe Posting -->
          <div>
            <select id="boardTypeFilter" class="form-select">
              <option value="">Semua Tipe Kolaborasi</option>
              <option value="pemasok">Cari Pemasok</option>
              <option value="mitra">Cari Mitra Bisnis</option>
              <option value="kolaborasi">Terbuka untuk Kolaborasi</option>
              <option value="acara">Cari Peluang Acara</option>
              <option value="layanan">Tawarkan Layanan</option>
            </select>
          </div>

          <!-- Filter Status -->
          <div>
            <select id="boardStatusFilter" class="form-select">
              <option value="all">Semua Status</option>
              <option value="open" selected>Masih Terbuka</option>
              <option value="closed">Sudah Ditutup</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Board Items Grid -->
      <div class="grid grid-cols-1 gap-3" id="boardPostsContainer">
        <!-- Rendered via JS -->
      </div>
    </div>
  </main>

  <!-- Modal Buat Posting Kolaborasi -->
  <div id="createBoardModal" class="modal-backdrop">
    <div class="modal-dialog modal-dialog-lg">
      <div class="modal-header">
        <h3 class="modal-title">Pasang Pengumuman Kolaborasi Baru</h3>
        <button id="btnCloseCreateBoardModal" class="modal-close" aria-label="Tutup">&times;</button>
      </div>
      <form id="createBoardForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="newBoardTitle">Judul Pengumuman <span class="required">*</span></label>
            <input type="text" id="newBoardTitle" class="form-input" placeholder="Contoh: Dicari Pemasok Botol Kaca 150ml Food-Grade untuk Sambal" required>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="form-group">
              <label class="form-label" for="newBoardType">Tipe Pengumuman <span class="required">*</span></label>
              <select id="newBoardType" class="form-select" required>
                <option value="pemasok">Cari Pemasok</option>
                <option value="mitra">Cari Mitra Bisnis</option>
                <option value="kolaborasi">Terbuka untuk Kolaborasi</option>
                <option value="acara">Cari Peluang Acara</option>
                <option value="layanan">Tawarkan Layanan</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="newBoardLocation">Cakupan Lokasi / Kota <span class="required">*</span></label>
              <input type="text" id="newBoardLocation" class="form-input" placeholder="Contoh: Jabodetabek, Bandung, atau Seluruh Indonesia" required>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="form-group">
              <label class="form-label" for="newBoardBudget">Estimasi Budget / Skema Kerjasama (Opsional)</label>
              <input type="text" id="newBoardBudget" class="form-input" placeholder="Contoh: Rp 5.000.000 / bulan atau Bagi Hasil">
            </div>

            <div class="form-group">
              <label class="form-label" for="newBoardDeadline">Batas Waktu Pengumuman <span class="required">*</span></label>
              <input type="date" id="newBoardDeadline" class="form-input" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="newBoardDesc">Deskripsi Kebutuhan & Kriteria <span class="required">*</span></label>
            <textarea id="newBoardDesc" class="form-textarea" placeholder="Tuliskan spesifikasi produk, volume yang dibutuhkan, syarat sertifikasi, atau keuntungan kerjasama..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnCancelCreateBoard" class="btn btn-outline btn-sm">Batal</button>
          <button type="submit" class="btn btn-primary btn-sm">Terbitkan Pengumuman</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Respon ke Pengumuman -->
  <div id="respondBoardModal" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Kirim Respon Kemitraan</h3>
        <button id="btnCloseRespondModal" class="modal-close" aria-label="Tutup">&times;</button>
      </div>
      <form id="respondBoardForm">
        <div class="modal-body">
          <p style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: 1rem;">
            Menanggapi pengumuman: <strong id="respondTargetTitle" style="color: var(--navy);">Judul</strong>
          </p>

          <div class="form-group">
            <label class="form-label" for="respondContact">Nomor WhatsApp / Kontak Anda <span class="required">*</span></label>
            <input type="text" id="respondContact" class="form-input" placeholder="08xxxxxxxxxx" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="respondMessage">Tawaran Solusi / Respon Anda <span class="required">*</span></label>
            <textarea id="respondMessage" class="form-textarea" placeholder="Jelaskan spesifikasi suplai atau bentuk penawaran Anda..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnCancelRespond" class="btn btn-outline btn-sm">Batal</button>
          <button type="submit" class="btn btn-cta btn-sm">Kirim Respon</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Dynamic Footer & Mobile Bottom Navigation -->
  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>

  <!-- Scripts -->
  <script type="module" src="js/board.js"></script>
</body>
</html>
