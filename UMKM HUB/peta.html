<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta UMKM Indonesia - Temukan UMKM Terdekat (Near Me) | UMKM Hub</title>
  <meta name="description" content="Peta interaktif sebaran UMKM Indonesia. Cari produsen lokal terdekat di sekitarmu dengan radius geolocation dan filter kategori.">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Leaflet CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="site-navbar"></div>

  <main class="section-sm" style="padding-bottom: 1rem;">
    <div class="container">
      <!-- Toolbar Header: Filter & Geolocation Button -->
      <div class="card mb-3" style="padding: 1rem 1.25rem;">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-center">
          <!-- Tombol UMKM Near Me -->
          <div>
            <button id="btnNearMe" class="btn btn-cta btn-full" style="font-size: var(--text-xs);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
              <span>UMKM Dekat Saya (GPS)</span>
            </button>
          </div>

          <!-- Filter Kategori -->
          <div>
            <select id="mapCategoryFilter" class="form-select" style="min-height: 42px;">
              <option value="">Semua Kategori</option>
              <option value="Kuliner">Kuliner</option>
              <option value="Kriya & Kerajinan">Kriya & Kerajinan</option>
              <option value="Fesyen">Fesyen</option>
              <option value="Pertanian & Agro">Pertanian & Agro</option>
              <option value="Jasa">Jasa</option>
              <option value="Teknologi & Digital">Teknologi & Digital</option>
              <option value="Kecantikan & Herbal">Kecantikan & Herbal</option>
            </select>
          </div>

          <!-- Filter Kota Manual -->
          <div>
            <select id="mapCityFilter" class="form-select" style="min-height: 42px;">
              <option value="">Semua Kota (Seluruh Indonesia)</option>
              <option value="Bogor">Bogor</option>
              <option value="Bandung">Bandung</option>
              <option value="Jakarta">Jakarta</option>
              <option value="Yogyakarta">Yogyakarta</option>
              <option value="Surabaya">Surabaya</option>
              <option value="Denpasar">Denpasar</option>
              <option value="Medan">Medan</option>
              <option value="Makassar">Makassar</option>
            </select>
          </div>

          <!-- Slider Radius (Hanya aktif jika mode GPS aktif) -->
          <div class="flex items-center gap-2">
            <span style="font-size: var(--text-xs); color: var(--navy); font-weight: 700; white-space: nowrap;">Radius:</span>
            <input type="range" id="radiusSlider" min="5" max="150" value="50" step="5" style="flex: 1; accent-color: var(--blue);">
            <span id="radiusValueLabel" style="font-size: var(--text-xs); font-weight: 700; color: var(--navy); min-width: 44px;">50 km</span>
          </div>
        </div>
      </div>

      <!-- Mobile Toggle Button (Peta / Daftar) -->
      <div class="map-mobile-toggle">
        <div class="segmented-control w-full" style="width: 100%; display: flex;">
          <button id="toggleShowMap" class="segmented-item active" style="flex: 1; text-align: center;">Tampilan Peta</button>
          <button id="toggleShowList" class="segmented-item" style="flex: 1; text-align: center;">Tampilan Daftar</button>
        </div>
      </div>

      <!-- Map & Sidebar Synchronized Layout -->
      <div class="map-page-layout">
        <!-- Sidebar Daftar UMKM Tersinkron -->
        <aside class="map-sidebar-list" id="mapSidebarList">
          <div style="padding: 0.875rem 1rem; border-bottom: 1px solid var(--border-light); background: var(--surface-bg);">
            <div class="flex items-center justify-between">
              <strong style="color: var(--navy); font-size: var(--text-sm);" id="mapListCountText">Memuat UMKM...</strong>
              <span id="gpsActiveIndicator" class="badge badge-collab" style="display: none; font-size: 0.65rem;">GPS Aktif</span>
            </div>
          </div>

          <div style="flex: 1; overflow-y: auto; padding: 0.75rem;" id="mapCardsScrollContainer">
            <!-- Cards list injected via JS -->
          </div>
        </aside>

        <!-- Canvas Leaflet Map -->
        <div class="map-canvas-container" id="mapCanvasContainer">
          <div id="leafletMap"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer & Mobile Bottom Navigation -->
  <div id="site-footer"></div>
  <div id="site-bottom-nav"></div>

  <!-- Scripts -->
  <script type="module" src="js/peta.js"></script>
</body>
</html>
